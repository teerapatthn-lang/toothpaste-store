<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า — toothpaste-store</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .order-wrap { max-width: 560px; }
    .order-wrap .btn { width: 100%; margin-top: var(--space-2); }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">toothpaste-store</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container order-wrap">
        <div class="section-head">
          <h1>สั่งซื้อสินค้า</h1>
          <hr class="accent-line">
          <p class="muted">กรอกข้อมูลด้านล่าง เราจะติดต่อกลับเพื่อยืนยันการสั่งซื้อและการจัดส่ง</p>
        </div>

        <form id="orderForm">
          <div class="form-field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="form-field">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" autocomplete="tel" required>
          </div>

          <div class="form-field">
            <label for="items">รายการสินค้า</label>
            <input type="text" id="items" name="items" required>
          </div>

          <div class="form-field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="text" id="total" name="total" inputmode="decimal" required>
          </div>

          <div class="form-field">
            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note"></textarea>
          </div>

          <button type="submit" class="btn btn-solid">ยืนยันสั่งซื้อ</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; toothpaste-store</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
